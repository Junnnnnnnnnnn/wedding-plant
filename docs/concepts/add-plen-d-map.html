<!doctype html>
<!-- Hallmark · pre-emit critique: P5 H5 E5 S4 R5 V5 -->
<!-- Hallmark · macrostructure: Split Canvas(폼 | 지도) · tone: utilitarian
     theme: 앱 incumbent(light · rounded-sans · warm-magenta) · nav: N3 side-rail · enrichment: none -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 D · 지도 우선 — 플랜 추가</title>
<link rel="stylesheet" href="add-plen-tokens.css">
<style>
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); }

  .pane {
    border-right: var(--rule); background: var(--card);
    display: flex; flex-direction: column; min-height: 0;
  }
  .pane__head { padding: var(--space-6) var(--space-6) var(--space-4); border-bottom: var(--rule); }
  .pane__kick { font-size: var(--text-sm); color: var(--accent); font-weight: 700; }
  .pane__title { font-size: var(--text-2xl); font-weight: 800; letter-spacing: -.035em; margin-top: 6px; }
  .pane__body { flex: 1; overflow-y: auto; padding: var(--space-5) var(--space-6); display: grid; gap: var(--space-5); align-content: start; }
  .pane__foot { border-top: var(--rule); padding: var(--space-4) var(--space-6); }

  .f__l { display: block; font-size: var(--text-sm); font-weight: 700; color: var(--ink-2); margin-bottom: var(--space-2); }
  .req { color: var(--accent); }
  .i {
    width: 100%; padding: 13px var(--space-4);
    background: var(--field); border: 1px solid var(--field-line);
    border-radius: var(--radius-md); font-size: var(--text-md); font-weight: 700;
  }
  .i:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .i--num { text-align: right; font-variant-numeric: tabular-nums; }
  .money { position: relative; }
  .money .unit { position: absolute; right: var(--space-4); top: 50%; transform: translateY(-50%); font-size: var(--text-sm); color: var(--ink-2); font-weight: 600; }
  .money .i { padding-right: 50px; }
  .two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: var(--space-3); }
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--space-2); }
  .seg button {
    padding: 11px 0; border-radius: var(--radius-sm); font-size: var(--text-sm);
    border: 1px solid var(--field-line); background: var(--field); color: var(--ink-3);
  }
  .seg button:hover { color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cats { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .cat { padding: 8px 13px; border-radius: var(--radius-pill); font-size: var(--text-sm); border: 1px solid var(--field-line); background: var(--card); color: var(--ink-3); }
  .cat[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); font-weight: 800; }
  .memo { width: 100%; min-height: 78px; resize: vertical; padding: var(--space-3) var(--space-4); background: var(--field); border: 1px solid var(--field-line); border-radius: var(--radius-md); font-size: var(--text-md); }
  .memo:focus { outline: none; border-color: var(--accent); background: var(--card); }
  .primary {
    width: 100%; padding: 16px; border-radius: var(--radius-lg);
    background: var(--accent); color: #fff; font-size: var(--text-lg); font-weight: 800;
    box-shadow: var(--shadow-lift); transition: transform var(--dur-fast) var(--ease-out);
  }
  .primary:hover { transform: translateY(-1px); }
  .primary:active { transform: translateY(0) scale(.995); }
  .foot__note { margin-bottom: var(--space-3); font-size: var(--text-sm); color: var(--ink-2); }
  .foot__note b { color: var(--ink); }

  /* ── 오른쪽: 지도가 화면을 채운다 ── */
  .canvas { position: relative; min-width: 0;
    background:
      radial-gradient(circle at 47% 44%, var(--accent) 0 9px, transparent 10px),
      radial-gradient(circle at 47% 44%, var(--accent-line) 0 44px, transparent 45px),
      linear-gradient(0deg, var(--line) 1px, transparent 1px) 0 0 / 100% 58px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 74px 100%,
      var(--field);
  }
  .search {
    position: absolute; top: var(--space-5); left: var(--space-5); right: var(--space-5);
    max-width: 460px;
  }
  .search input {
    width: 100%; padding: 14px var(--space-5);
    background: var(--card); border: var(--rule); border-radius: var(--radius-pill);
    font-size: var(--text-md); font-weight: 700; box-shadow: var(--shadow-card);
  }
  .search input:focus { outline: none; border-color: var(--accent); }
  .results {
    margin-top: var(--space-2); background: var(--card); border: var(--rule);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden;
  }
  .res { display: block; width: 100%; text-align: left; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); }
  .res:last-child { border-bottom: 0; }
  .res:hover { background: var(--accent-soft); }
  .res[aria-selected="true"] { background: var(--accent-soft); }
  .res__n { display: block; font-weight: 800; font-size: var(--text-md); }
  .res__a { display: block; font-size: var(--text-xs); color: var(--ink-3); margin-top: 3px; }

  .pin {
    position: absolute; left: 47%; top: 44%; transform: translate(-50%, calc(-100% - 18px));
    background: var(--card); border: var(--rule); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); padding: var(--space-4) var(--space-5); min-width: 232px;
  }
  .pin__n { font-weight: 800; }
  .pin__a { font-size: var(--text-xs); color: var(--ink-3); margin-top: 3px; }
  .pin__link { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--accent); font-weight: 700; }

  .skip {
    position: absolute; right: var(--space-5); bottom: var(--space-5);
    background: var(--card); border: var(--rule); border-radius: var(--radius-pill);
    padding: 10px var(--space-5); font-size: var(--text-sm); color: var(--ink-2);
    box-shadow: var(--shadow-card);
  }
  .skip:hover { color: var(--accent); border-color: var(--accent-line); }

  @media (max-width: 1000px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .pane { border-right: 0; border-bottom: var(--rule); }
    .pane__body { overflow: visible; }
    .canvas { min-height: 420px; }
  }
  @media (max-width: 620px) {
    .pane__head, .pane__body, .pane__foot { padding-left: var(--space-4); padding-right: var(--space-4); }
    .two { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="주 메뉴">
    <div class="rail__brand"><span class="rail__mark">WP</span>웨딩 플랜트</div>
    <div class="rail__label">우리 결혼 준비</div>
    <a class="rail__item" href="#"><i class="rail__dot"></i>홈</a>
    <a class="rail__item" href="#" aria-current="page"><i class="rail__dot"></i>플랜 보드</a>
    <a class="rail__item" href="#"><i class="rail__dot"></i>참여 플랜 · 대화</a>
    <div class="rail__label">둘러보기</div>
    <a class="rail__item" href="#"><i class="rail__dot"></i>피드</a>
    <a class="rail__item" href="#"><i class="rail__dot"></i>Settings</a>
  </nav>

  <div class="stage">
    <div class="split">
      <form class="pane" onsubmit="return false">
        <div class="pane__head">
          <p class="pane__kick">플랜 추가 · 2027년 1월</p>
          <h1 class="pane__title">어디서 쓰나요</h1>
        </div>

        <div class="pane__body">
          <div>
            <label class="f__l" for="d-title">제목 <span class="req">*</span></label>
            <input class="i" id="d-title" value="씨쉘 푸꾸옥 호텔 앤 스파 숙박" placeholder="어떤 지출인가요?">
          </div>
          <div>
            <span class="f__l">카테고리 <span class="req">*</span></span>
            <div class="cats">
              <button class="cat" type="button" aria-pressed="false">상견례</button>
              <button class="cat" type="button" aria-pressed="false">스드메</button>
              <button class="cat" type="button" aria-pressed="true">신혼여행</button>
              <button class="cat" type="button" aria-pressed="false">웨딩홀</button>
              <button class="cat" type="button">+ 추가</button>
            </div>
          </div>
          <div>
            <span class="f__l">결제 유형 <span class="req">*</span></span>
            <div class="seg">
              <button type="button" aria-pressed="false">현금</button>
              <button type="button" aria-pressed="true">카드</button>
              <button type="button" aria-pressed="false">기타</button>
            </div>
          </div>
          <div class="two">
            <div>
              <label class="f__l" for="d-amt">금액</label>
              <div class="money">
                <input class="i i--num" id="d-amt" inputmode="numeric" value="142">
                <span class="unit">만원</span>
              </div>
            </div>
            <div>
              <label class="f__l" for="d-date">일자</label>
              <input class="i" id="d-date" value="2027-01-10">
            </div>
          </div>
          <div>
            <label class="f__l" for="d-memo">메모</label>
            <textarea class="memo" id="d-memo" placeholder="메모 남기기">공항픽업 알아보기</textarea>
          </div>
        </div>

        <div class="pane__foot">
          <p class="foot__note">저장하면 남은 예산 <b>2,591만원 → 2,449만원</b></p>
          <button class="primary" type="submit">플랜 저장하기</button>
        </div>
      </form>

      <section class="canvas" aria-label="장소 고르기">
        <div class="search">
          <input type="search" value="씨쉘 푸꾸옥" aria-label="장소 검색" placeholder="예식장, 스튜디오 등">
          <div class="results" role="listbox" aria-label="검색 결과">
            <button class="res" type="button" role="option" aria-selected="true">
              <span class="res__n">씨쉘 푸꾸옥 호텔 앤 스파</span>
              <span class="res__a">Bãi Trường, Dương Tơ, Phú Quốc</span>
            </button>
            <button class="res" type="button" role="option" aria-selected="false">
              <span class="res__n">씨쉘 리조트 &amp; 스파 푸꾸옥</span>
              <span class="res__a">Đường Trần Hưng Đạo, Phú Quốc</span>
            </button>
          </div>
        </div>

        <div class="pin">
          <p class="pin__n">씨쉘 푸꾸옥 호텔 앤 스파</p>
          <p class="pin__a">Bãi Trường, Dương Tơ, Phú Quốc</p>
          <p class="pin__link">이 위치로 정하기 · 카카오맵에서 열기</p>
        </div>

        <button class="skip" type="button">장소 없이 저장할게요</button>
      </section>
    </div>
  </div>
</div>
</body>
</html>
